<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" fill="none">
  <defs>
    <linearGradient id="gTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c744"/>
      <stop offset="50%" stop-color="#d4950f"/>
      <stop offset="100%" stop-color="#b87a08"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4950f"/>
      <stop offset="100%" stop-color="#8a5c04"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a910"/>
      <stop offset="100%" stop-color="#a06808"/>
    </linearGradient>
  </defs>

  <!-- Small top diamond -->
  <polygon points="50,2 55,10 50,18 45,10" fill="url(#gTop)"/>

  <!-- Crown facets -->
  <polygon points="28,22 50,22 44,40 36,40" fill="url(#gTop)"/>
  <polygon points="50,22 72,22 64,40 56,40" fill="#e8a910"/>

  <!-- Upper girdle -->
  <polygon points="18,30 28,22 36,40 26,46" fill="url(#gLeft)"/>
  <polygon points="72,22 82,30 74,46 64,40" fill="#c8870c"/>

  <!-- Middle facets -->
  <polygon points="26,46 36,40 50,70 36,62" fill="url(#gMid)"/>
  <polygon points="36,40 64,40 50,70" fill="url(#gTop)"/>
  <polygon points="64,40 74,46 64,62 50,70" fill="url(#gMid)"/>

  <!-- Lower pavilion -->
  <polygon points="26,46 36,62 50,70 18,30" fill="url(#gLeft)" opacity="0.85"/>
  <polygon points="74,46 82,30 50,70 64,62" fill="#a06408" opacity="0.85"/>

  <!-- Outline strokes -->
  <polyline points="28,22 18,30 26,46 36,62 50,70 64,62 74,46 82,30 72,22" fill="none" stroke="#f0c033" stroke-width="0.7" opacity="0.6"/>
  <line x1="28" y1="22" x2="72" y2="22" stroke="#f0c033" stroke-width="0.7" opacity="0.6"/>
  <line x1="36" y1="40" x2="64" y2="40" stroke="#f0c033" stroke-width="0.5" opacity="0.5"/>
  <line x1="50" y1="22" x2="50" y2="70" stroke="#f0c033" stroke-width="0.4" opacity="0.4"/>
</svg>
